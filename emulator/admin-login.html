<!doctype html>
<html lang="id">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login Admin — Perjuangan Semut</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1623;color:#e6ebf2;font:14px system-ui,-apple-system,sans-serif}
main{width:min(390px,calc(100% - 36px));padding:28px;background:#1a2332;border:1px solid #2e3b4e;border-radius:12px;box-shadow:0 18px 60px #0008}
h1{margin:0 0 8px;font-size:24px}p{color:#aeb9c9;margin:0 0 22px}label{display:block;margin:13px 0 6px;color:#c9d3e1}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #3a475b;border-radius:7px;background:#111925;color:#fff;font:inherit}button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:7px;background:#18b89a;color:#fff;font-weight:700;cursor:pointer}#status{min-height:20px;margin-top:14px;color:#ffadad}
</style>
<main>
  <h1>Login Admin</h1>
  <p>Masuk untuk mengelola user, quest, barang, ekonomi, dan chat.</p>
  <form id="form">
    <label>Email admin</label><input id="email" type="email" autocomplete="username" required>
    <label>Password</label><input id="password" type="password" autocomplete="current-password" required>
    <button>Masuk ke Dashboard</button>
  </form>
  <div id="status"></div>
</main>
<script>
const form=document.getElementById('form'),status=document.getElementById('status');
form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='';try{
 const r=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});
 const d=await r.json();if(!r.ok)throw Error(d.error||'login gagal');location.href='/admin';
 }catch(err){status.textContent=err.message;}});
</script>
